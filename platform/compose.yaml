# Prospecta — serviços da plataforma (incluídos pelo docker-compose.yml da raiz).
#
# Regras de exposição:
#   - Somente o gateway (web + API autenticada) é publicado, e apenas em 127.0.0.1.
#   - Banco, filas, scraper e WuzAPI ficam na rede interna "backend".
#   - O contêiner web (Next.js) fica só na rede "edge" e não alcança o banco.
#   - Para desenvolvimento no host, use platform/compose.devports.yaml (também só 127.0.0.1).

x-api-env: &api-env
  NODE_ENV: production
  TZ: America/Sao_Paulo
  DATABASE_URL: postgresql://${POSTGRES_USER:-prospecta}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-prospecta}?schema=public
  REDIS_URL: redis://:${VALKEY_PASSWORD:?defina VALKEY_PASSWORD no .env}@valkey:6379
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?defina APP_ENCRYPTION_KEY no .env}
  SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no .env}
  ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  MAIL_FROM: ${MAIL_FROM:-Prospecta <no-reply@prospecta.local>}
  GMAPS_SCRAPER_URL: http://google-maps-scraper:8080
  GMAPS_SCRAPER_ENABLED: ${GMAPS_SCRAPER_ENABLED:-true}
  OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
  NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
  PHOTON_URL: ${PHOTON_URL:-https://photon.komoot.io}
  SEARCH_SOURCES: ${SEARCH_SOURCES:-GOOGLE_MAPS_SCRAPER}
  GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
  GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-}
  GOOGLE_GEOCODING_API_KEY: ${GOOGLE_GEOCODING_API_KEY:-}
  HTTP_USER_AGENT: ${HTTP_USER_AGENT:-ProspectaBot/0.1 (+local; contato via administrador)}
  WUZAPI_URL: http://wuzapi:8080
  WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN:?defina WUZAPI_ADMIN_TOKEN no .env}
  WUZAPI_WEBHOOK_URL: http://platform-api:4000/api/webhooks/wuzapi
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # vazio por padrão; só libera destinos internos explicitamente (ex.: demo-site em testes)
  CRAWLER_ALLOW_HOSTS: ${CRAWLER_ALLOW_HOSTS:-}

services:
  postgres:
    image: postgres:17-alpine
    container_name: prospecta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prospecta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-prospecta}
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb

  valkey:
    image: valkey/valkey:8-alpine
    container_name: prospecta-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${VALKEY_PASSWORD:?defina VALKEY_PASSWORD no .env}", "--maxmemory-policy", "noeviction"]
    volumes:
      - valkeydata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

  mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: prospecta-mailpit
    restart: unless-stopped
    environment:
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:?defina MAILPIT_UI_AUTH no .env}
      MP_MAX_MESSAGES: 500
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:8025:8025"   # caixa de e-mails local (recuperação de senha)
    networks: [backend]

  wuzapi:
    image: asternic/wuzapi:1.0.9
    container_name: prospecta-wuzapi
    restart: unless-stopped
    environment:
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN:?defina WUZAPI_ADMIN_TOKEN no .env}
      WUZAPI_GLOBAL_ENCRYPTION_KEY: ${WUZAPI_GLOBAL_ENCRYPTION_KEY:?defina WUZAPI_GLOBAL_ENCRYPTION_KEY no .env}
      WUZAPI_GLOBAL_HMAC_KEY: ${WUZAPI_GLOBAL_HMAC_KEY:?defina WUZAPI_GLOBAL_HMAC_KEY no .env}
      WEBHOOK_FORMAT: json
      TZ: America/Sao_Paulo
      SESSION_DEVICE_NAME: Prospecta
      WUZAPI_AUTO_PRESENCE: unavailable
      LOG_LEVEL: info
    command: ["-datadir", "/data"]
    volumes:
      - wuzapidata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  platform-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: prospecta/api:local
    container_name: prospecta-api
    restart: unless-stopped
    environment:
      <<: *api-env
      ROLE: api
      PORT: 4000
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    networks: [backend, edge, default]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  platform-worker:
    image: prospecta/api:local
    container_name: prospecta-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      <<: *api-env
      ROLE: worker
    depends_on:
      platform-api: { condition: service_healthy }
    networks: [backend, default]
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/worker-alive && find /tmp/worker-alive -mmin -2 | grep -q worker-alive"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

  platform-web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: prospecta/web:local
    container_name: prospecta-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  platform-gateway:
    image: nginx:1.30-alpine
    container_name: prospecta-gateway
    restart: unless-stopped
    depends_on:
      platform-api: { condition: service_healthy }
      platform-web: { condition: service_healthy }
    ports:
      - "127.0.0.1:3000:80"     # único ponto de entrada da plataforma
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # site fictício para testes de enriquecimento (opt-in: --profile demo)
  demo-site:
    image: nginx:1.30-alpine
    container_name: prospecta-demo-site
    profiles: ["demo"]
    volumes:
      - ./demo-site:/usr/share/nginx/html:ro
    networks:
      backend:
        aliases: [demo.prospecta.test]   # domínio reservado .test (RFC 2606)

networks:
  backend:
  edge:

volumes:
  pgdata:
  valkeydata:
  wuzapidata:
