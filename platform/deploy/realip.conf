# Só em produção (montado pelo compose.prod.yaml): o gateway não tem porta aberta e só recebe
# conexões do Caddy pela rede interna do Docker, então confia no IP do visitante que ele repassa.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
