# Gateway da plataforma Prospecta (publicado apenas em 127.0.0.1:3000).
#   /api/*  -> platform-api:4000 (autenticação por sessão; OpenAPI em /api/docs)
#   /*      -> platform-web:3000 (Next.js)
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 20m;

    # Cabeçalhos de segurança aplicados a tudo que sai pelo gateway
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # API e web também enviam esses cabeçalhos: o gateway é a fonte única para não haver valores duplicados ou conflitantes
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # O webhook do WuzAPI chega pela rede interna direto na API; nunca pelo gateway.
    location ^~ /api/webhooks/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://platform-api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://platform-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
